[project]
name = "btborders"
version = "0.1.0"
description = "Share one mouse and keyboard between two computers over Bluetooth (Mouse-without-Borders style)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7.7",
    "cryptography>=42",
    "pyperclip>=1.8",
    "pyserial>=3.5",
    "rich>=13",
]

[project.optional-dependencies]
qr = ["qrcode>=7"]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
btb = "btborders.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btborders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
